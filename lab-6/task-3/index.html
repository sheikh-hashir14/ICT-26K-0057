<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIGON Cufflinks</title>
    <style>
        .product-card{
            background-color:blanchedalmond;
            width: 600px;
            height: auto;
            border-radius: 10px;
        }

        img{
            width: 60%;
            height: auto;
            border-radius: 10px;
            margin: 20px;
        }
        img:hover{
            transform: scale(1.05);
        }

        h2{
            margin: 10px;
        }

        p{
            margin: 10px;
        }

        p.price{
            font-weight: bold;
        }

        button{
            margin: 10px;
        }

        button:hover{
            color: chocolate;
            transform:scale(1.02);
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img src="cufflink-1.jpg" alt="cufflinks image">
        <h2>Silver Premium Cufflinks</h2>
        <p>These Silver Colored Cufflinks go well with any Kind of Dress<br>Whether You have a Neutral Toned Suit, a Light Tinted One or the Classic Navy, These Pair with them All</p>
        <p class="price">$39.99</p>
        <button>Buy Now</button>
    </div>
</body>
</html>
